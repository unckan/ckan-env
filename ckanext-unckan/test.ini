[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = ckan@localhost

[app:main]
use = config:../../ckan/test-core.ini

# Insert any custom config settings to be used when running your extension's
# tests here. These will override the one defined in CKAN core's test-core.ini
ckan.plugins = push_errors unckan pdf_view xloader activity tracking api_tracking superset announcements dbquery selfinfo

# Config selfinfo
ckan.selfinfo.ckan_repos_path = /app/unckan/src_extensions
ckan.selfinfo.ckan_repos = ckanext-unckan
ckan.selfinfo.page_url = /ckan-admin/selfinfo

# xloader configuration
ckanext.xloader.api_token = xxx

# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s

