[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = ckan@localhost

[app:main]
ckan.datastore.read_url = postgresql://datastore_read:pass@postgresql_uni/datastore_test
ckan.datastore.write_url = postgresql://datastore_write:pass@postgresql_uni/datastore_test
solr_url = http://solr_uni:8983/solr/ckan
ckan.redis.url = redis://redis_uni:6379/0
sqlalchemy.url = postgresql://ckan_default:pass@postgresql_uni/ckan_test
ckanext.xloader.ssl_verify = false
use = config:/app/unckan/ckan/test-core.ini

ckan.plugins = push_errors unckan pdf_view datastore xloader activity api_tracking superset announcements dbquery serverterminal

# xloader configuration
ckanext.xloader.api_token = xxx

# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
